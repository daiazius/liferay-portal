import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task deployJar(type: Copy)
task patch(type: PatchTask)

dependencies {
	implementation group: "javax.servlet", name: "javax.servlet-api", version: "3.0.1"
	implementation group: "org.owasp.esapi", name: "esapi", version: "2.1.0.1"
}

deploy {
	finalizedBy deployJar
}

deployJar {
	ext {
		autoClean = false
	}

	from jar
	into "../../../lib/development"

	rename {
		"esapi.jar"
	}
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/owasp/esapi/reference/DefaultValidator.java"

	originalLibModuleName = "esapi"
}